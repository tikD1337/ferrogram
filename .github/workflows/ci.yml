# Runs the project checks on every push to main and on every pull request.
# Tests that need a real TPM or an installed TDLib are #[ignore]d and do not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test, build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; rustup installs it with rustfmt and clippy.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release -p tg-app --locked

      - name: Demo smoke test
        shell: pwsh
        run: |
          # Renders the demo without an account and saves a snapshot; fails if the window cannot start.
          ./target/release/ferrogram.exe --demo --snapshot demo.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path demo.png)) { throw 'The demo did not produce a snapshot.' }

      - name: Upload the demo snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-snapshot
          path: demo.png
          retention-days: 7

# Disposable probe: what do H.264 decoding and scaling through Windows Media Foundation cost
# in memory and CPU, compared with the client's idle footprint? Media Foundation ships with
# Windows, so it adds nothing to the binary size.
[package]
name = "video-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

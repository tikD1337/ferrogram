# Disposable probe that answers one question: how much memory and CPU does TDLib itself
# cost after sign-in and synchronization? Not part of the product.
[package]
name = "tdlib-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console"] }

# Same settings as the product's release profile, to keep measurements comparable.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
